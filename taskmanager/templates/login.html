 {% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskManager{% endblock %}</title>

<!-- Lien  Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Lien Bootstrap pour les icones -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<!-- Lien  CSS  -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>


    <div class="container d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4 p-5" style="max-width:560px; width:100%;">

<!-- Logo  -->
        <div class="text-center">

            <div class="rounded-circle d-inline-flex justify-content-center align-items-center mb-3"
                 style="width:90px; height:90px; background:#6F4E37;">

                <i class="bi bi-clipboard-check text-white" style="font-size:35px;"></i>

            </div>

            <h1 class="fw-bold">
                Connexion
            </h1>

            <div class="mx-auto mb-4"
                 style="width:90px; height:3px; background:#6F4E37;">
            </div>

        </div>

        <form method="POST">

            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger">
            Nom d'utilisateur ou mot de passe incorrect.
            </div>
            {% endif %}

<!-- Nom d'utilisateur  -->

            <div class="mb-4">

                <label class="form-label">
                    Nom d'utilisateur
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Entrez votre nom d'utilisateur"
                        required>

                </div>

            </div>

 <!-- Mot de passe  -->

            <div class="mb-4">

                <label class="form-label">
                    Mot de passe
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Entrez votre mot de passe"
                        required>

                </div>

            </div>

         <!-- Bouton  -->

           <button
             type="submit"
             class="btn w-100 text-white fw-bold py-2"
             style="background:#6F4E37;">
             Se connecter
             
            </button>


        </form>

        <!-- Séparateur  -->

        <div class="d-flex align-items-center my-4">

            <hr class="flex-grow-1">

            <span class="mx-3 text-muted">
                ou
            </span>



            <hr class="flex-grow-1">

        </div>

       <!-- Inscription -->

        <div class="text-center">

            <p>
                Vous n'avez pas encore de compte ?
            </p>

            <a href="{% url 'register' %}" style="color: #be8f6d;">S'inscrire</a>
        </div>

    </div>

</div>

 
   </div>




</body>

</html>
