{% extends "base.html" %}

{% block title %}
Modifier un projet
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow border-0">

                <div class="card-header text-white text-center"
                     style="background-color:#6F4E37;">

                    <h2>Modifier le projet</h2>

                </div>

                <div class="card-body">

                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">
                                Nom du projet
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="nom"
                                value="{{ projet.nom }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                name="description"
                                rows="5">{{ projet.description }}
                            </textarea>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'projet_detail' projet.id %}"
                               class="btn btn-secondary">
                                Annuler
                            </a>

                            <button
                                type="submit"
                                class="btn text-white"
                                style="background-color:#6F4E37;">
                                Enregistrer
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
