
 {% load static %}

<!DOCTYPE html>
<html lang="fr">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskManager</title>

<!-- Lien  Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Lien Bootstrap pour les icones -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<!-- Lien  CSS  -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
<div class="container d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4 p-5" style="max-width:560px; width:100%;">


        <div class="text-center">

            <div class="rounded-circle d-inline-flex justify-content-center align-items-center mb-3"
                 style="width:90px; height:90px; background:#6F4E37;">

                <i class="bi bi-person-plus text-white" style="font-size:45px;"></i>

            </div>

            <h1 class="fw-bold">
                Inscription
            </h1>

            <div class="mx-auto mb-4"
                 style="width:90px; height:3px; background:#6F4E37;">
            </div>

        </div>
         {% if form.errors %}
       <div class="alert alert-danger">
          {{ form.errors }}
       </div>
{% endif %}

        <form method="POST">

            {% csrf_token %}
<!-- #Nom d'utilisateur -->
            <div class="mb-3">

                <label class="form-label">
                    Nom d'utilisateur
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="Entrez votre nom d'utilisateur"
                        required>

                </div>

            </div>



<!-- Mot de passe  -->
            <div class="mb-3">

                <label class="form-label">
                    Mot de passe
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        name="password1"
                        placeholder="Choisissez un mot de passe"
                        required>

                </div>

            </div>

<!-- Confirmer le mot de passe -->
            <div class="mb-4">

                <label class="form-label">
                    Confirmer le mot de passe
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        name="password2"
                        placeholder="Confirmez votre mot de passe"
                        required>

                </div>

            </div>

<!-- # Bouton d'inscription  -->
            <button
                type="submit"
                class="btn w-100 text-white fw-bold py-2"
                style="background:#6F4E37;">
                S'inscrire 

            </button>

        </form>

        <!-- Séparateur -->
        <div class="d-flex align-items-center my-4">

            <hr class="flex-grow-1">

            <span class="mx-3 text-muted">
                ou
            </span>

            <hr class="flex-grow-1">

        </div>

<!-- Lien pour acceder dans la page de connexion  -->
        <div class="text-center">

            <p>
                Vous avez déjà un compte ?
            </p>

            <a href="{% url 'login' %}" style="color: #be8f6d;">
                Se connecter
            </a>

        </div>

    </div>

</div>

</body>

</html>
